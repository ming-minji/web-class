<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>논리연산자</title>
</head>
<body>
    <script>
        10>2 && 5>2 // true  && => 그리고 / 둘 중 하나라도 틀리면 true가 될 수 없음
        5>1 && 5>2 && 5<3 //false
        10>4 && 0 && 20 // false -> 0은 false임
        let b= 10>4 && 0 && 20
        console.log(b)
        0 && 10 && 20 && 30 // false

        10<2 || 3!=3 || 4>2 // || => 또는 / 얘는 하나라도 true가 있으면 true가 됨
        0 || !10 || !!20 // true
        let a = 10 || "" || 20 //true
        console.log(a)

    </script>
</body>
</html>
