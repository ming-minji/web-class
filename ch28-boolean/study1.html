<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boolean</title>
</head>
<body>
    <h1>boolean - 참 거짓 데이터</h1>
    <script>
        10>2 // true
        10<2 // false
        10>=2 // true 10이 2보다 크거나 같다
        10<=2 // fales 10이 2보다 작거나 같다
        10==10 // true 10이 10과 같다
        10===10 // true 10이 10과 데이터형태까지 모두 같다 (엄격한 비교)
        10!=1 // true 10이 1과 같지 않다 (!는 부정의 의미, !! 두 개 사용하면 부정의 부정이라 긍정이 됨)
        !(10>2) // false 
        console.log(10>2)
        console.log(!(10>2))

        0 // 0은 false로 간주됨
        "" //내용이 없는 것도 false임
        let a // 뒤에 내용이 없어서 false임
        undefined // false로 간주
        null // false로 간주 (null은 비운다라는 뜻 -> 내용이 없음)
        -12 // 수가 있으니깐 true 수가 없는 건 오로지 0밖에 없음
        !"" // 빈문자 데이터는 false지만 그걸 부정하는거니깐 true로 간주 됨
        !a // true a라는 빈문자데이터에 부정을 하니깐 true임

        let b = null // b라는 변수에는 undefined가 있었는데 null을 사용해서 b안에 있는 것들을 싹 비운다는 뜻 false임
    </script>
</body>
</html>
