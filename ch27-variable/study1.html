<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수</title>
</head>
<body>
    <h1>변수</h1>
    <p>변수는 변할 가능성이 있는 수</p>
    <script>
        let a; // a라는 변수를 선언(생성)한다.
        a = 10 // a라는 변수에 10을 초기화한다. -> 최초로 저장하는 걸 초기화라고 함
        console.log(a + 10)
        console.log(a)
        a = a+10
        console.log(a)
        a+=10
        console.log(a)

        let b = 20 //b라는 변수에 메모리를 생성하면서 20이라는 값을 초기화(저장)시킴
        b-=2 //b에서 2를 뺀 것을 b에다가 다시 저장한다. -> 20-2 = 18
        console.log(b)

        let c = "안녕하세요"
        console.log(c.length)
        console.log(c[2])

        let name = prompt("당신의 이름이 뭔가요?")
        document.write("<h3>"+name+"! 안녕!!</h3>")

        let age = prompt(name+"님의 나이는 몇 살인가요?")
        document.write("<p>["+name+"님의] 나이가 "+age+"살이군요. 반갑습니다.</p>")

    </script>

    <h1>상수</h1>
    <p>상수는 변하지 않는 수</p>
    <script>
        123
        "김민지"
    </script>
</body>
</html>
