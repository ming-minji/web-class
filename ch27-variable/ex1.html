    <div>
        <!-- <h1>문제</h1>
        <p>사용자에게 이름, 국어점수, 영어점수, 수학점수, 사회점수를 각각 물어보고 평균값을 계산하여, 다음과 같이 홈페이지에 나타날 수 있도록 소스코드 작성하시오(p태그로 마크업이 될 수 있게 할 것 / 평균점수는 소수점 두 자리까지)</p>
        
        답안예시 -> [김민지님의] 평균점수는 92.33점 입니다. 
    </div> -->


    <script>
        let userName = prompt("당신의 이름이 뭔가요?")
        let scoreKo = Number(prompt(userName+"의 국어점수는 몇 점인가요?"))
        let scoreEng = Number(prompt(userName+"의 영어점수는 몇 점인가요?"))
        let scoreMT = Number(prompt(userName+"의 수학점수는 몇 점인가요?"))
        let scoreSo = Number(prompt(userName+"의 사회점수는 몇 점인가요?"))

        let scoreSum = scoreKo+scoreEng+scoreMT+scoreSo
        let scoreAver = (scoreSum/4).toFixed(2)
        console.log(scoreSum)
        console.log(scoreAver)
       
        document.write("<p>["+userName+"님의] 평균점수는 "+scoreAver+"점 입니다.</p>")
    </script>
