<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문-for</title>
</head>
<body>
    <h1>반복문</h1>
    <p>조건이 참으로 계산되는 동안 소스코드를 반복하는 문법구조</p> 
    <!-- i++는 기존에 있던 i값에 1을 더한 값 (ex) i가 0이면 i++은 1 / i--는 1을 빼는 것-->
     <!-- 조건이 참이면 중괄호로 들어감, 중괄호로 들어가면 조건이 실패할 때까지 계속 실행됨 -> 
      i=0은 맨 처음에만 작동되고 그 후에는 작동 X / i=0은 4보다 작다, i++는 1, 0에다가 1을 더하면 1은 4보다 작다(true) 그다음 또 i++로 돌아가서 2, 2는 4보다 작다(true) ... 이런식으로 참으로 계속 반복되다가 i++가 4가 되면 4랑 같아서 작다는 조건이 달성이 안되고 끝남 / 그래서 아래 예문은 0,1,2,3까지 콘솔창에서 나옴 for(let i=0 ; i<4 ; i++){document.write(`<li>0</li>`)} -->
    <script>
        // for(조건){반복될 소스코드}
        // 사용자에게 원하는 구구단수를 입력하게 한 후 구구단이 출력될 수 있도록 소스코드를 바꿔보시오
        let dan = Number(prompt("몇 단을 출력할까요?"))
        
        for(let i=1 ; i<=9 ; i++){
            document.write(`<li>${dan}x${i}=${dan*i}</li>`)
        }


        let myclass = ["장윤서","이은지","김민지","조성현","김선영"]
    </script>
    <ul>
        <!-- 0부터 3까지 회전시키겠다여서 i<4인거임 0,1,2,3 -->
        <script>
            for(let i=0 ; i<myclass.length ; i++){
                document.write(`<li>${myclass[i]}</li>`)  
            }
        </script>
    </ul>
</body>
</html>
