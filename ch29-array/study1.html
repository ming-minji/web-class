<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열</title>
</head>
<body>
    <script>
        let a = ["사과","배","귤","수박"] // 배열의 원소 => 왼쪽부터 사과가 0번째 배가 1번째 ... 이런식으로 0부터 시작함
        a[0] // 대괄호는 인덱스박스 그 안에 숫자는 순번을 뜻함 4로 적으면 5번째가 없으니깐 undefined가 뜸
        console.log(a[0][1]) //사과라는 문자열에서 1번째 글자(2번째임)
        console.log(a[2])
        // "김민지"[0] 글자는 문자열이라고 함
        // "김민지".length
        console.log(a.length)
        let b = [
            1,
            2,
            3,
            4
        ][3]
        // a[b[3]]  //b[3]은 4, a[4]는 5번째인데 없으니깐 undefined
        // a[b[3]?1:2] //b[[3]은 4, 4는 true, 그래서 1, a[1]은 배

        let c = [
            "장윤서",
            "이은지",
            "김선영",
            "김가희",
            "최예슬"] // 왼쪽부터 0이니깐 장윤서가 첫번째임
        c[0] //장윤서
        c[4] //최예슬
        c[1].length //3
        c[2][1]+c[3][2] //선희
        (!c[3]||!c[4]||c[1])[0]  //이

        // let d = 0||0||1
        // console.log(d)
        
        let person1 = ["정현진","남자","infp",170,77,false,["게임","독서","러닝"]]
        person1[0] //"정현진"
        person1[3] //170
        person1[5]?"기혼":"미혼" //"미혼"
        person1[6][2][1] 
        //배열데이터 7번째 ["게임","독서","러닝"]중에서 3번째니깐 "러닝"인데 러닝에서 2번째니깐 "닝"


        
    </script>
</body>
</html>
