<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학관련도구(함수)</title>
</head>
<body>
    <h1>수학 계산 함수</h1>
    <script>
        console.log(Math.ceil(5.33)) /* 올린함수-> 6 */
        console.log(Math.floor(5.9)) /* 내린함수 -> 5 */
        console.log(Math.round(5.5)) /* 반올림 -> 6 */
        console.log(Math.pow(10,3)) /* 10을 3번 곱함 -> 1000 */
        console.log(Math.sqrt(100)) /* 루트 씌워서 나온 값 -> 10 (100의 루트값은 10임) */
        console.log(Math.abs(-30)) /* 절댓값 계산 -> 30 */
        console.log(Math.max(1,2,3,4,5,6)) /* 최댓값 -> 6 */
        console.log(Math.min(1,2,3)) /* 최솟값 -> 1 */
        console.log(Math.random()) /* 0보다는 크고 1보다는 작은 난수를 랜덤으로 표현 (새로고침 할 때마다 다르게 나옴) */
        console.log(typeof(123.333231423.toFixed(3))) /* 소수 세번째 자리까지 나오게 함 -> 123.333 !!대신 이건 숫자데이터가 아닌 문자데이터로 나옴!! */
    </script>
</body>
</html>
